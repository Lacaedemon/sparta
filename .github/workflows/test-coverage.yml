# Measures GDScript line coverage for the GUT unit suite, gates a PR on its
# patch coverage, and uploads the report to Codecov. Instrumentation
# (addons/coverage, jamie-pate/godot-code-coverage's godot4 branch) runs the
# tests through reloaded, counter-injected copies of the scripts, so this is a
# job separate from the fast validate-and-test gate, which lives in
# godot-ci.yml and stays uninstrumented.
#
# The patch-coverage gate is computed here, from the report this job writes,
# by the same `tools/check.sh patch_coverage` contributors run locally (the
# codecov/patch metric: the share of the lines this diff adds under scripts/
# that the suite covers, against the project-wide total). So a Codecov outage
# no longer blocks a merge. The Codecov upload stays fatal on pushes to main,
# where a failure means token or config breakage worth a red check, and is a
# warning on pull requests.
name: Test coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so patch_coverage can find the merge-base with the PR's base.
          fetch-depth: 0

      # GODOT_VERSION/GUT_VERSION pins now live as the composite action's own
      # defaults (.github/actions/setup-godot-project/action.yml). The
      # coverage addon (addons/coverage) is committed, so only GUT is
      # fetched at run time; import resolves autoloads/class_name globals/
      # cross-script references before the coverage run instruments and
      # reloads them.
      - name: Set up Godot project
        uses: ./.github/actions/setup-godot-project

      - name: Run unit tests with coverage, then gate patch coverage
        # `coverage` runs the instrumented GUT suite (the pre/post-run hooks
        # instrument res://scripts and write coverage/lcov.info; a test failure
        # fails it). `patch_coverage` then reuses that report from the same
        # invocation and fails when the diff's added scripts/ lines fall below
        # the project-wide total, as codecov/patch's `target: auto` does. On a
        # push to main the merge-base is HEAD itself, so it reports nothing to
        # check and passes.
        env:
          GODOT_BIN: godot
          SPARTA_CHECK_PATCH_COVERAGE_BASE: origin/${{ github.base_ref || 'main' }}
        run: |
          set -o pipefail
          tools/check.sh coverage patch_coverage 2>&1 | tee coverage-check.log

      - name: Verify coverage report was written
        # The post-run hook reports a failed lcov write with push_error(), which
        # does not make Godot exit non-zero, so the step above can pass without
        # producing a report. Fail here if it is missing -- a missing report is a
        # real breakage.
        if: ${{ !cancelled() }}
        run: |
          if [ ! -s coverage/lcov.info ]; then
            echo "::error::coverage/lcov.info was not written by the coverage run"
            exit 1
          fi

      - name: Summarize patch coverage
        # Puts the patch-coverage verdict and the uncovered added lines on the
        # run's summary page, whether the gate passed or failed.
        if: ${{ !cancelled() && hashFiles('coverage-check.log') != '' }}
        run: |
          {
            echo "### Patch coverage"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' coverage-check.log \
              | grep -E 'Patch coverage|missing:|No scripts|no new commits|nothing to report|below the target|skipping patch coverage' \
              || echo "(no patch-coverage lines in the log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          disable_search: true          # upload only the file above
          # Fatal on pushes to main (token/config breakage); a warning on PRs, whose
          # patch-coverage gate is the step above rather than Codecov.
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
          token: ${{ secrets.CODECOV_TOKEN }}
