# Measures GDScript line coverage for the GUT unit suite, gates a PR on its
# patch coverage, and uploads the report to Codecov. Instrumentation
# (addons/coverage, jamie-pate/godot-code-coverage's godot4 branch) runs the
# tests through reloaded, counter-injected copies of the scripts, so this is a
# job separate from the fast validate-and-test gate, which lives in
# godot-ci.yml and stays uninstrumented.
#
# The patch-coverage gate is computed here, from the report this job writes,
# by the same `tools/check.sh patch_coverage` contributors run locally (the
# codecov/patch metric: the share of the lines this diff adds under scripts/
# that the suite covers, against the project-wide total). So a Codecov outage
# no longer blocks a merge. The Codecov upload stays fatal on pushes to main,
# where a failure means token or config breakage worth a red check, and cannot
# fail a pull request's job.
name: Test coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # Above setup, the import (900 s budget) and the 5400 s coverage budget, so
    # check.sh's own kill message fires before the runner cancels the job.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so patch_coverage can find the merge-base with the PR's base.
          fetch-depth: 0

      - name: Resolve the patch-coverage base
        # check.sh falls back to origin/main when the given base does not
        # resolve, which would gate a stacked PR against the wrong diff; fail
        # here instead.
        if: github.event_name == 'pull_request'
        run: git rev-parse --verify "origin/${{ github.base_ref }}^{commit}"

      - name: Decide whether the coverage run is needed
        # The run takes 30 to 45+ minutes. A pull request that changes only docs,
        # the website, benchmarks, agent notes or unrelated workflows changes no file
        # the suite reads, so every step below is skipped for it (#1963).
        # Pushes to main and manual runs always run. tools/ci/coverage-needed.sh
        # fails open: an undecidable diff runs the coverage.
        id: needed
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            tools/ci/coverage-needed.sh "origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      # GODOT_VERSION/GUT_VERSION pins now live as the composite action's own
      # defaults (.github/actions/setup-godot-project/action.yml). The
      # coverage addon (addons/coverage) is committed, so only GUT is
      # fetched at run time; import resolves autoloads/class_name globals/
      # cross-script references before the coverage run instruments and
      # reloads them.
      - name: Set up Godot project
        if: steps.needed.outputs.needed == 'true'
        uses: ./.github/actions/setup-godot-project

      - name: Run unit tests with coverage, then gate patch coverage
        id: coverage
        if: steps.needed.outputs.needed == 'true'
        # `coverage` runs the instrumented GUT suite (the pre/post-run hooks
        # instrument res://scripts and write coverage/lcov.info) and fails on a
        # test failure, a script error, or a missing report. `patch_coverage`
        # then reuses that report from the same invocation and fails when the
        # diff's added scripts/ lines fall below the project-wide total, as
        # codecov/patch's `target: auto` does. On a push to main the
        # merge-base is HEAD itself, so it reports nothing to check and passes.
        # On a pull request, a skipped gate (no resolvable base or common
        # history) fails rather than passing silently.
        env:
          GODOT_BIN: godot
          # The suite alone has run 30 to 45+ minutes on the shared runners; a 2700 s
          # budget was hit by 17 of the last 38 runs (#1963), so this leaves headroom.
          # It is still a hard kill: a hang fails the job loudly.
          SPARTA_CHECK_COVERAGE_TIMEOUT: 5400
          SPARTA_CHECK_PATCH_COVERAGE_BASE: origin/${{ github.base_ref || 'main' }}
        run: |
          set -o pipefail
          tools/check.sh coverage patch_coverage 2>&1 | tee coverage-check.log
          if [ "${{ github.event_name }}" = pull_request ] \
              && grep -qE 'skipping patch coverage' coverage-check.log; then
            echo "::error::patch coverage was skipped on a pull request (see the log above)"
            exit 1
          fi

      - name: Summarize patch coverage
        # Puts the patch_coverage section of the log (its verdict, per-file
        # uncovered lines, and any error or skip message) on the run's summary
        # page, whether the gate passed or failed.
        if: ${{ !cancelled() && steps.needed.outputs.needed == 'true' && hashFiles('coverage-check.log') != '' }}
        run: |
          {
            echo "### Patch coverage"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' coverage-check.log \
              | sed -n '/== patch_coverage ==/,/== summary ==/p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        # Only a report from a passing suite is uploaded, as before.
        if: steps.coverage.outcome == 'success'
        # A failed upload never fails a pull request's job (its gate is the step
        # above), whatever the action does with fail_ci_if_error internally.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          disable_search: true          # upload only the file above
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
          token: ${{ secrets.CODECOV_TOKEN }}
