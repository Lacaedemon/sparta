# Fourth leg of the Sparta docs-site PR-preview family. Triggered when the
# build half (website-preview.yml) finishes; downloads its artifact and crawls
# the extracted site with a headless browser to catch equations MathJax cannot
# render -- a failure mode invisible to the Quarto/pandoc build log, since
# MathJax only typesets client-side. Independent of the deploy half (no
# gh-pages write needed).
#
# NOTE: the `workflows:` value below MUST match the `name:` of the build
# workflow (website-preview.yml). `workflow_run` triggers only fire when this
# file lives on the default branch (main).
#
# Pinned to the @v2 moving major tag -- the upstream-recommended consumer pin.
name: Website Preview Equation Check

on:
  workflow_run:
    workflows: ["Website Preview Build"]
    types: [completed]

jobs:
  check:
    permissions:
      contents: read
      actions: read
    uses: Morrison-Lab/gha/.github/workflows/check-equation-renders.yml@v2
