# Lint tracked YAML with yamllint (bundled default config), plus a companion
# check that flags long `run:` script blocks in workflow/action YAML as
# decomposition candidates. Advisory on first adoption (`fail: false`) so a
# pre-existing backlog does not block unrelated PRs while the rules migrate.
#
# Pinned to the @v2 moving major tag -- the upstream-recommended consumer pin.
name: Lint YAML

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    uses: Morrison-Lab/gha/.github/workflows/lint-yaml.yml@v2
    with:
      fail: false
