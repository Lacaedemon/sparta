# Scan narrative prose in Markdown and Quarto files for AI-generated tell
# density, via the reusable workflow in Morrison-Lab/gha. Advisory on first
# adoption (`fail: false`): agent-instruction trees are ignored so CLAUDE.md /
# memories do not trip a check aimed at player-facing docs.
#
# Pinned to the @v2 moving major tag -- the upstream-recommended consumer pin.
name: Check AI Tells

on:
  pull_request:
    paths:
      - '**.md'
      - '**.qmd'
      - '**.Rmd'
  push:
    branches: [main]
    paths:
      - '**.md'
      - '**.qmd'
      - '**.Rmd'

jobs:
  check-ai-tells:
    uses: Morrison-Lab/gha/.github/workflows/check-ai-tells.yml@v2
    with:
      fail: false
      paths-ignore: '.claude/,.gemini/,.agents/'
