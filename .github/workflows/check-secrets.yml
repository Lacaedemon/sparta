# Scan the repository's git history for committed credentials (API tokens,
# private keys, high-entropy password assignments) with gitleaks, via the
# reusable workflow in Morrison-Lab/gha. History rather than the diff: a secret
# committed and then removed later is still exposed until the orphaned commit
# is garbage-collected.
#
# Complements GitHub's native secret scanning; it does not replace it. Neither
# substitutes for rotating a credential once it has been exposed.
#
# Pinned to the @v2 moving major tag -- the upstream-recommended consumer pin.
name: Check for secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    uses: Morrison-Lab/gha/.github/workflows/check-secrets.yml@v2
