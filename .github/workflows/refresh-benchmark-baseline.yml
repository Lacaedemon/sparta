# Periodically refresh tools/benchmark/baseline.json against the CI runners' current
# (variable) speed. benchmark.yml's pass/fail verdict comes from a same-run comparison
# against the PR's base tip, so this file cannot make a PR read as a regression; it feeds
# only the secondary, informational table in the benchmark comment, and the refresh keeps
# that table meaningful as CI runner speed drifts between manual refreshes.
#
# Averages two consecutive runs: a single run's timing is noisy enough on a shared runner
# that two functionally-identical runs can swing ~20% on their own, so averaging guards
# against a false-positive baseline the same way a manual refresh would, applied here
# automatically instead of relying on someone noticing drift and re-running it by hand.
#
# Averaging narrows that swing but does not remove it, so the refresh also applies a
# TOLERANCE BAND: the baseline is only rewritten when the largest metric change
# clears it. The band itself is
# DEFAULT_TOLERANCE_PCT in tools/benchmark/refresh_band.py -- the UPPER bound of the
# 20-30% swing tools/perf/README.md documents, since a band at the lower end would still
# pass through noise in the upper part of that range. Below the band, the measured
# delta cannot be told apart from runner noise, so opening a PR would ask a reviewer a
# question the evidence cannot answer, and repeatedly doing so trains the reflex to wave
# such PRs through. A suppressed refresh still writes a job summary, so 'no PR this week'
# stays distinguishable from a broken workflow. See tools/benchmark/refresh_band.py.

name: Refresh benchmark baseline

on:
  schedule:
    # Weekly, Monday 06:00 UTC -- ahead of the working week. Cadence matched to how long it
    # took the baseline to drift far enough to matter last time (roughly 9 days / 52 commits),
    # not a tighter interval this repo's commit rate doesn't need.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      tolerance_pct:
        description: >-
          Largest metric change still treated as runner noise, in percent. Leave blank
          to use the committed default (DEFAULT_TOLERANCE_PCT in
          tools/benchmark/refresh_band.py); set it lower to force a refresh this run
          only. Deliberately has no default here, so the band lives in exactly one
          place and this dialog cannot drift from what the weekly run actually uses.
        required: false

concurrency:
  group: refresh-benchmark-baseline
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  # GODOT_VERSION/GUT_VERSION pins now live as the composite action's own
  # defaults (.github/actions/setup-godot-project/action.yml).
  # Same CI-tuned measurement window benchmark.yml itself uses (not run-benchmark.sh's local
  # 120/600 defaults) -- the whole point is to match the conditions the regression check runs
  # under.
  WARMUP_TICKS: 60
  MEASURE_TICKS: 300
  # Empty on a scheduled run (no inputs), which makes refresh_band.py's own
  # DEFAULT_TOLERANCE_PCT the band. Only a workflow_dispatch override puts a number
  # here, so this file holds no band literal to drift from the module's.
  REFRESH_TOLERANCE_PCT: ${{ inputs.tolerance_pct || '' }}

jobs:
  refresh-baseline:
    # Scheduled/dispatch runs only ever run on the base repo (no fork context here, unlike
    # benchmark.yml's pull_request trigger), so no fork guard is needed before pushing.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Persist a push-capable token so open-sync-pr can push without putting the token
          # in the remote URL (mirrors Morrison-Lab/gha's bump-submodule.yml).
          token: ${{ secrets.WORKFLOW_TOKEN || github.token }}

      - name: Set up Godot project
        uses: ./.github/actions/setup-godot-project

      - name: Run benchmark twice
        env:
          SPARTA_BENCHMARK_WARMUP_TICKS: ${{ env.WARMUP_TICKS }}
          SPARTA_BENCHMARK_TICKS: ${{ env.MEASURE_TICKS }}
        run: |
          set -euo pipefail
          # Two consecutive, functionally-identical runs -- averaged below, see this
          # workflow's header comment for why.
          for i in 1 2; do
            SPARTA_BENCHMARK_OUT="/tmp/benchmark-run${i}.json" tools/benchmark/run-benchmark.sh
            if [ ! -s "/tmp/benchmark-run${i}.json" ]; then
              echo "::error::benchmark run ${i} produced no report file"
              exit 1
            fi
          done

      - name: Average the runs and write the refreshed baseline
        id: refresh
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys

          # The band decision lives in a testable module (tools/lib/tests/test-refresh-band.sh
          # exercises it on every PR) rather than inline here, where only cron would run it.
          sys.path.insert(0, "tools/benchmark")
          from refresh_band import (
              METRICS,
              evaluate,
              format_delta_table,
              is_usable,
              tolerance_from_env,
          )

          reports = [json.load(open(f"/tmp/benchmark-run{i}.json")) for i in (1, 2)]
          for i, r in enumerate(reports, 1):
              if r.get("early_stop"):
                  # stderr, not stdout: stdout is redirected into $GITHUB_OUTPUT above, and a
                  # bare `::warning::` line there isn't valid key=value/heredoc syntax -- it
                  # would fail the step's output-file parsing.
                  print(f"::warning::benchmark run {i} ended early; averaged baseline may be partial.", file=sys.stderr)

          # Validate each RAW run before averaging. Averaging launders a bad input: a
          # -1.0 ms run paired with a normal 47.868 ms one averages to a finite,
          # positive 23.434, which passes every later check and commits as a genuine
          # "47.9% faster" result. NaN and Infinity poison the mean and would be
          # caught downstream, but zero and negative do not, so checking only the
          # average validates the derived number instead of the inputs that made it.
          for i, r in enumerate(reports, 1):
              # .get on BOTH levels: a report with no "stats" at all would otherwise
              # raise a bare KeyError carrying neither the run number nor the metric,
              # which is a worse message than every other corruption path here.
              run_stats = r.get("stats")
              if not isinstance(run_stats, dict):
                  run_stats = {}
              bad = [m for m in METRICS if not is_usable(run_stats.get(m))]
              if bad:
                  raise ValueError(
                      "benchmark run %d reported an unusable %s"
                      % (i, ", ".join(bad))
                  )

          means = [r["stats"]["mean_ms"] for r in reports]
          p95s = [r["stats"]["p95_ms"] for r in reports]
          maxs = [r["stats"]["max_ms"] for r in reports]
          avg_mean, avg_p95, avg_max = (sum(v) / 2 for v in (means, p95s, maxs))

          run_url = os.environ["RUN_URL"]
          old_baseline_path = "tools/benchmark/baseline.json"

          # The try covers the READ ONLY. It deliberately does not wrap the shape check
          # below: a KeyError or TypeError raised while picking metrics out of a parsed
          # object could just as easily be this script's own typo as the file's
          # corruption, and absorbing it as "no usable baseline" would hide a script bug
          # behind the self-heal path -- the opposite of the fail-fast split the except
          # list is chosen for.
          #
          # Catch by base class where the subclasses are interchangeable, because
          # enumerating them leaves gaps: json.JSONDecodeError and UnicodeDecodeError are
          # siblings under ValueError, not parent and child, so a truncation landing
          # mid-way through a multi-byte character escapes a catch naming only the
          # former. Any escape wedges the weekly cron, because the bad file stays
          # committed and every later run fails on it identically.
          #
          # FileNotFoundError specifically, NOT OSError: a missing file is the ordinary
          # bootstrap case, while a PermissionError or an I/O fault is an infrastructure
          # problem that should fail the run loudly rather than be laundered into a
          # routine-looking refresh PR.
          try:
              with open(old_baseline_path) as f:
                  old = json.load(f)
          except FileNotFoundError:
              old = None
              file_present = False
          except ValueError:
              # Present, but unparseable or undecodable -- not the same as absent.
              old = None
              file_present = True
          else:
              file_present = True

          # Shape check, outside the try. A file whose shape is wrong has no usable
          # incumbent, exactly like an absent one. Individual VALUES are not judged here:
          # refresh_band.is_usable owns that, and routing a present-but-corrupt value
          # through it is what makes the reported reason say the baseline was unusable
          # rather than that none was committed. METRICS comes from the module so this
          # cannot drift from the keys evaluate actually reads.
          # "absent" only when there is genuinely no file. A file that exists but does
          # not yield three metrics is "malformed", and saying so is the difference
          # between telling a reader nothing was ever committed and telling them what
          # was committed is broken.
          old_stats = None
          incumbent = "malformed" if file_present else "absent"
          if isinstance(old, dict):
              stats = old.get("stats")
              if isinstance(stats, dict) and all(m in stats for m in METRICS):
                  old_stats = {m: stats[m] for m in METRICS}
                  # Left as-is deliberately: evaluate reads incumbent only when
                  # old_stats is None, and relabelling a present, valid baseline
                  # "absent" here would be a lie waiting for the first reader who
                  # consults it outside that branch.

          base = reports[0]
          comment = (
              "CI-RUNNER baseline for .github/workflows/benchmark.yml's relative regression "
              "check. This is NOT the 60fps/reference-hardware target from PLAN.md (the "
              "developer's PC with a discrete GPU) -- GitHub Actions runners are "
              "different, variable-speed hardware; see tools/benchmark/README.md. This "
              "baseline is a SECONDARY, informational comparison only -- benchmark.yml's "
              "primary check is the PR's merged tree (the refs/pull/N/merge checkout) against the base branch's own tip, both measured in "
              "the same run, which cannot go stale the way this file can. Established "
              "as the MEAN of two consecutive, functionally-identical 'Refresh benchmark "
              f"baseline' workflow runs at {run_url} (mean {means[0]:.3f}ms/p95 {p95s[0]:.3f}ms/"
              f"max {maxs[0]:.3f}ms and mean {means[1]:.3f}ms/p95 {p95s[1]:.3f}ms/max "
              f"{maxs[1]:.3f}ms) -- ubuntu-latest, {base['scenario']} at scale "
              f"{base['scale']}x, warmup_ticks={base['warmup_ticks']} "
              f"measure_ticks={base['requested_measure_ticks']} (the CI-tuned window in "
              "benchmark.yml, not BenchmarkRunner's local 120/600 defaults). Averaging two "
              "runs rather than trusting a single one is deliberate: back-to-back runs with "
              "zero functional code difference can swing ~20% from noisy shared-runner timing "
              "alone -- a single-run baseline risks reproducing the false-regression "
              "problem this automation exists to prevent. Refreshed automatically "
              "by .github/workflows/refresh-benchmark-baseline.yml on a weekly schedule; see "
              "that workflow for the refresh mechanics, or run it manually via "
              "workflow_dispatch."
          )
          new_baseline = {
              "_comment": comment,
              "scenario": base["scenario"],
              "scale": base["scale"],
              "soldier_count": base["soldier_count"],
              "warmup_ticks": base["warmup_ticks"],
              "requested_measure_ticks": base["requested_measure_ticks"],
              "samples_collected": base["samples_collected"],
              "stats": {
                  "mean_ms": round(avg_mean, 3),
                  "p95_ms": round(avg_p95, 3),
                  "max_ms": round(avg_max, 3),
              },
          }
          # Only rewrite the baseline when the change clears the noise band. Below it the
          # measured delta is indistinguishable from runner drift, so leaving the committed
          # file alone means open-sync-pr sees no change and opens no PR.
          # Compare the ROUNDED values that would actually be written, so a delta that
          # survives the band cannot round away to an identical file.
          decision = evaluate(
              old_stats,
              new_baseline["stats"],
              tolerance_from_env(os.environ.get("REFRESH_TOLERANCE_PCT")),
              incumbent=incumbent,
          )

          summary_lines = ["## Benchmark baseline refresh", "", decision["reason"], ""]
          if decision["deltas"]:
              summary_lines += [format_delta_table(decision["deltas"]), ""]
          summary_lines.append("Band: %.1f%% (REFRESH_TOLERANCE_PCT). Source run: %s"
                               % (decision["tolerance_pct"], run_url))
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as f:
                  f.write("\n".join(summary_lines) + "\n")
          # stderr, not stdout -- stdout is redirected into $GITHUB_OUTPUT.
          print(decision["reason"], file=sys.stderr)

          if not decision["write"]:
              # Nothing written, nothing for open-sync-pr to find. Done.
              print("refreshed=false")
              sys.exit(0)

          with open(old_baseline_path, "w") as f:
              json.dump(new_baseline, f, indent=2)
              f.write("\n")

          # Percent change comes from the decision's own deltas rather than being
          # recomputed here: one implementation of the arithmetic, which is why the
          # band module exists at all. Absent only when there was no usable baseline.
          def fmt_row(metric, name, new_v):
              # Reads old_stats directly rather than taking the value as an argument, so
              # "no baseline at all" and "a baseline whose value is unusable" stay
              # distinguishable. Passing a bare value collapses them: a null metric in a
              # present file is indistinguishable from an absent file once it is just None.
              if old_stats is None:
                  return f"| {name} | n/a | {new_v:.3f} ms | n/a |"
              old_v = old_stats[metric]
              if not is_usable(old_v):
                  # Flag the corrupt reading in the cell itself. Rendered bare it reads as
                  # an ordinary historical measurement, and the row carries no other signal
                  # that this is the value that invalidated the whole comparison. Uses the
                  # module's own test rather than re-deriving one: a local `old_v <= 0`
                  # would miss NaN, the value most in need of the marker and the one that
                  # renders most innocently.
                  #
                  # The format may raise: ":.3f" rejects a string and None. It does NOT
                  # reject a bool, which formats as 1.000 through int -- that case is
                  # caught by is_usable above, not by this except, and still gets the
                  # marker. repr is the fallback so a corrupt value is still named rather
                  # than crashing the step that is building the body explaining it.
                  try:
                      old_s = f"{old_v:.3f} ms (unusable)"
                  except (TypeError, ValueError):
                      old_s = f"{old_v!r} (unusable)"
              else:
                  old_s = f"{old_v:.3f} ms"
              delta = decision["deltas"].get(metric)
              pct = "n/a" if delta is None else f"{delta:+.1f}%"
              return f"| {name} | {old_s} | {new_v:.3f} ms | {pct} |"

          table = "\n".join([
              "| metric | old baseline | new baseline (avg) | change |",
              "| --- | --- | --- | --- |",
              fmt_row("mean_ms", "mean tick time", avg_mean),
              fmt_row("p95_ms", "p95 tick time", avg_p95),
              fmt_row("max_ms", "max tick time", avg_max),
          ])

          # refreshed=true is emitted only AFTER the write has actually happened, so
          # the output can never claim a refresh the file did not receive. GitHub
          # would skip the gated step anyway on a failed step, but that is an implicit
          # success() gate a later `if: always()` on that step would quietly remove.
          print("refreshed=true")
          print("pr_body<<BASELINE_PR_BODY_EOF")
          # Reason FIRST: it names the metric that cleared the band, or says the old
          # baseline was unusable. A reader skimming a long PR body should meet that
          # before the table, not after it.
          print(decision["reason"])
          print()
          print(table)
          print("BASELINE_PR_BODY_EOF")
          PY

      - name: Open PR if the baseline changed
        # Belt and braces: a suppressed refresh leaves baseline.json untouched, so
        # open-sync-pr would find nothing to push anyway. Gating explicitly keeps the
        # intent readable and stops a future edit to the write path from silently
        # reviving the weekly noise PR.
        if: steps.refresh.outputs.refreshed == 'true'
        uses: Morrison-Lab/gha/open-sync-pr@v2
        with:
          branch: automated/refresh-benchmark-baseline
          base: main
          paths: tools/benchmark/baseline.json
          commit-message: "chore: refresh benchmark.yml's CI baseline (scheduled)"
          pr-body: |
            Automated weekly refresh of `tools/benchmark/baseline.json`, per #756.

            ${{ steps.refresh.outputs.pr_body }}

            Both source runs came from this workflow run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            No code/behavior change -- `tools/benchmark/baseline.json` only.

            Generated by `.github/workflows/refresh-benchmark-baseline.yml`.
          token: ${{ secrets.WORKFLOW_TOKEN || github.token }}
