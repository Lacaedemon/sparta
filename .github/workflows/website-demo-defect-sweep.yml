# Weekly ABSOLUTE defect sweep of the website demo catalog.
#
# Every other demo check in this repo is DIFF-scoped: `check.sh demo_defects` scans only
# the demo scripts a diff changed, demo-video.yml scans only the one PR-tailored clip, and
# website-demo-diff.yml runs the analyzer only over clips whose transcript CHANGED versus
# the merge-base. None of them ever asks "is this clip defective, full stop", so a defect
# sitting identically on both sides of every diff -- or one that predates the scan
# entirely -- is invisible to all of them. The catalog is 70+ clips published on the live
# docs site, most untouched for weeks. The motivating case was a NORMAL -> Square reform
# sending 28% of soldiers across the block, which a human found by eye on the published
# page because no automated check was in a position to.
#
# Reports to a marker-tagged tracking ISSUE rather than a check run, so the verdict list is
# durable and diffable week to week without blocking anything. Deliberately NOT a gate: we
# do not yet know how many existing clips fail, and turning a wall of pre-existing failures
# into a merge blocker would be unusable. Report first; decide about gating once the
# baseline is known.
#
# Distinct from website-demo-diff.yml, which answers "did THIS PR change any clip's
# behavior" on a per-PR basis and is likewise informational. This workflow answers "is the
# published catalog healthy right now", on main, with no PR involved.

name: Website demo defect sweep

on:
  schedule:
    # Weekly, Monday 07:00 UTC -- matching refresh-benchmark-baseline.yml's cadence, and
    # staggered an hour after it so the two heavy scheduled Godot jobs do not contend for
    # runners.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      report:
        description: >-
          Thread this run's verdicts onto the tracking issue. Turn off for a diagnostic
          dispatch from a branch, whose transcripts are wanted as an artifact without
          logging a non-main commit's verdicts as the catalog's weekly health.
        type: boolean
        default: true
      clips:
        description: >-
          Comma-separated catalog clip names to dump and judge (empty = the whole
          catalog). A one-clip dispatch is the cheap way to get this runner's transcript
          of a clip whose verdict differs from a local run.
        type: string
        default: ''

# A diagnostic dispatch (report=false) gets its own group: it shares the runner budget
# but must not cancel an in-flight Monday sweep, whose report it would not replace since
# it skips the upsert. Reporting runs (scheduled, or a dispatch with report=true) still
# supersede each other, as before.
concurrency:
  group: website-demo-defect-sweep-${{ github.event_name == 'workflow_dispatch' && !inputs.report && 'diagnostic' || 'report' }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write   # upsert the tracking issue

jobs:
  sweep:
    name: Sweep the demo catalog for defects
    runs-on: ubuntu-latest
    # One full headless catalog sweep. --fixed-fps detaches the sim from the wall clock, so
    # this is CPU-bound rather than clip-duration-bound; website-demo-diff.yml budgets 18
    # minutes for each of its TWO sweeps, so one sweep plus the analyzer fits comfortably.
    timeout-minutes: 45
    env:
      # Empty on a scheduled run (dump and judge everything); a dispatch may narrow it.
      # Job-wide because BOTH the dump and the sweep read it: a sweep that saw the whole
      # catalog while the dump saw one clip would report every other row as missing.
      SPARTA_DUMP_CLIPS: ${{ inputs.clips }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Godot project
        id: godot
        # GUT is needed because the project's test files extend GutTest, so the import must
        # resolve that class; the import itself happens inside dump-demo-states.sh, which
        # is why run-import is off here (same reason website-demo-diff.yml turns it off).
        uses: ./.github/actions/setup-godot-project
        with:
          run-import: false

      - name: Dump state transcripts for the whole catalog
        id: dump
        # dump-demo-states.sh exits at the FIRST clip that fails, times out, or writes no
        # snapshots, leaving every later clip undumped. Without continue-on-error that would
        # abort the job before the sweep step ever ran, so one flaky clip out of ~73 would
        # cost the entire week's report -- and the sweep's own "no transcript" bucket, built
        # for exactly this case, would be unreachable for the failure it was written to
        # describe. Let the sweep judge whatever did complete; the undumped clips report
        # themselves, and the issue body says the run was partial.
        continue-on-error: true
        timeout-minutes: 25
        run: |
          GODOT_BIN=godot website/tools/dump-demo-states.sh /tmp/sweep/transcripts "$GITHUB_WORKSPACE"

      - name: Run the absolute defect sweep
        id: sweep
        if: always()
        env:
          # Keep every analyzer run's raw JSON (the per-verdict worst/threshold numbers
          # the compact table drops) NEXT TO the transcript tree, not inside it: the
          # whole-tree consumers (analyze_transcript.gd --compare-hash-trees,
          # website-demo-state-diff.sh) read every immediate subdirectory as a clip, so
          # a directory of JSON inside the tree would surface as a bogus clip row.
          DEMO_DEFECT_JSON_DIR: /tmp/sweep/analyzer-json
        run: |
          set -euo pipefail
          GODOT_BIN=godot tools/ci/website-demo-defect-sweep.sh \
            /tmp/sweep/transcripts /tmp/sweep/sweep.md "$GITHUB_WORKSPACE" | tee /tmp/sweep-stdout.txt
          # SWEEP-SUMMARY<TAB>total<TAB>clean<TAB>defect<TAB>malformed<TAB>na<TAB>missing
          SUMMARY=$(grep '^SWEEP-SUMMARY' /tmp/sweep-stdout.txt | head -n1)
          {
            echo "total=$(printf '%s' "$SUMMARY" | cut -f2)"
            echo "clean=$(printf '%s' "$SUMMARY" | cut -f3)"
            echo "defect=$(printf '%s' "$SUMMARY" | cut -f4)"
            echo "malformed=$(printf '%s' "$SUMMARY" | cut -f5)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the transcripts behind the verdicts
        if: always()
        # A verdict is a pure function of its transcript (DemoDefects is deterministic),
        # but a transcript is NOT a pure function of the commit: the sim is bit-exact only
        # within one build and platform (docs/individual-collision-design.md), and the
        # melee-heavy clips have come back with different verdicts on this runner and on a
        # Windows machine at the same commit. So the runner's own dumps are the evidence:
        # re-running the analyzer over them reproduces a row anywhere, without re-dumping
        # on a machine whose sim may not match, and their hash streams localize a
        # cross-platform divergence to its first tick (analyze_transcript.gd
        # --compare-hashes) instead of leaving it to be reconstructed from the verdicts.
        # The artifact root holds transcripts/ (the tree), analyzer-json/ and sweep.md.
        # overwrite: a re-run of a failed job keeps the run id, and a v4 artifact is
        # immutable, so without it the retry's upload fails on the name.
        uses: actions/upload-artifact@v4
        with:
          name: website-demo-defect-sweep-${{ github.run_id }}
          path: /tmp/sweep
          retention-days: 90
          if-no-files-found: warn
          overwrite: true

      - name: Ensure the tracking label exists
        if: always() && steps.sweep.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.report)
        # `gh issue create --label` hard-fails on a label the repo does not have, and
        # upsert-issue.sh scopes its duplicate search to this same label. Creating it
        # idempotently here keeps the workflow self-contained rather than depending on
        # someone having added the label by hand first.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create demo-defect-sweep \
            --repo "${{ github.repository }}" \
            --color ededed \
            --description "Auto-filed: weekly absolute defect sweep of the website demo catalog" \
            --force

      - name: Upsert the tracking issue
        # A diagnostic dispatch (report=false) stops before this step: its transcripts are
        # on the run as an artifact, and nothing from a non-main commit reaches the log.
        # So does a failed sweep (a selection naming no catalog clip, a missing jq): its
        # outputs are empty and there is no report to thread, only a red run to read. A
        # PARTIAL dump is not that case -- the dump step has continue-on-error, so the
        # sweep still succeeds over what was dumped and the body says it was partial.
        if: always() && steps.sweep.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.report)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT: website-demo-defect-sweep-${{ github.run_id }}
          RUNNER_OS: ${{ runner.os }}
          GODOT_VERSION: ${{ steps.godot.outputs.godot-version }}
          SHA: ${{ github.sha }}
          TOTAL: ${{ steps.sweep.outputs.total }}
          CLEAN: ${{ steps.sweep.outputs.clean }}
          DEFECT: ${{ steps.sweep.outputs.defect }}
          MALFORMED: ${{ steps.sweep.outputs.malformed }}
          DUMP_OUTCOME: ${{ steps.dump.outcome }}
          CLIPS: ${{ inputs.clips }}
        run: |
          set -euo pipefail
          MARKER="<!-- sparta-demo-defect-sweep -->"
          # A narrowed dispatch that still reports must say so: its table covers the named
          # clips only, and reads as diagnostic rather than as the catalog's weekly health.
          if [ -n "$CLIPS" ]; then
            SCOPE=$(printf '> [!NOTE]\n> Narrowed dispatch: only `clips=%s` were dumped and judged, on their own rather than against a diff (#1147). A diagnostic entry, not the catalog'"'"'s weekly health -- the row counts below are for this selection.' "$CLIPS")
          else
            SCOPE='Every row of `website/tools/demo-catalog.sh`, judged on its own rather than against a diff (#1147).'
          fi
          # A partial dump would otherwise render as a wall of "no transcript" rows that
          # read like mass defects rather than missing data.
          NOTE=""
          if [ "$DUMP_OUTCOME" != "success" ]; then
            NOTE=$(printf '\n> [!WARNING]\n> The catalog dump did not complete (`%s`), so this sweep judged only the clips dumped before it stopped. Rows reading `no transcript` below are undumped, not necessarily defective.\n' "$DUMP_OUTCOME")
          fi
          TITLE="Website demo catalog: absolute defect sweep"
          # The platform line and the artifact pointer are what make a row reproducible:
          # the sim is bit-exact only within one build and platform, so a verdict is
          # reproduced by re-running the analyzer over THIS run's transcripts, never by
          # re-dumping the clip on another machine.
          BODY=$(printf '%s\n## Absolute DemoDefects sweep of the website demo catalog\n\n%s\nCommit: %s\nRun: %s\nJudged on %s with Godot %s. The transcripts behind every row are the run'"'"'s `%s` artifact (kept 90 days) -- see "Reproducing a sweep verdict" in `demos/README.md`.\n%s\n%s\n\n<sub>Informational only -- never a merge gate. Re-run on demand via this workflow'"'"'s `workflow_dispatch`, or wait for the Monday sweep; each run threads onto this issue as a comment so the catalog'"'"'s health is diffable week to week. A `defect` row is a real DemoDefects verdict on a published clip; a `malformed` row means that clip'"'"'s own `expect`/`defect_exemptions` block is broken and NOTHING was judged for it.</sub>' \
            "$MARKER" "$SCOPE" "$SHA" "$RUN_URL" "$RUNNER_OS" "$GODOT_VERSION" "$ARTIFACT" "$NOTE" "$(cat /tmp/sweep/sweep.md)")
          tools/ci/upsert-issue.sh \
            "${{ github.repository }}" \
            "$MARKER" \
            "demo-defect-sweep" \
            "$TITLE" \
            "$BODY" \
            "demo-defect-sweep" \
            "$BODY"
          echo "Sweep: $CLEAN clean, $DEFECT defect, $MALFORMED malformed, of $TOTAL clips."
