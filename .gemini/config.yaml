# Gemini Code Assist / Antigravity behaviour for this repository on GitHub.
#
# Automated PR reviews are PAUSED: the Gemini/Antigravity review quota is
# exhausted, and a quota-exhausted reviewer posts either nothing or a
# "could not review" stub, which reads as an approval it never gave.
# Turning it off in-repo makes the absence deliberate and documented instead
# of a silent failure that a reader has to reverse-engineer.
#
# Claude's own review (`.github/workflows/claude-code-review.yml`) and Copilot
# code review are unaffected and still run on every PR.
#
# To re-enable once quota is back: set `disable: false` and delete the
# `pull_request_opened` block, so whatever the product default is applies
# rather than a pinned copy of it that can drift (today: help: false,
# summary: false, code_review: true).
have_fun: false

code_review:
  disable: true
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  # Belt and braces: even with `disable: true`, spell out that nothing fires
  # when a pull request is opened, so a schema change that reads only this
  # block cannot revive the reviewer on its own.
  pull_request_opened:
    help: false
    summary: false
    code_review: false
